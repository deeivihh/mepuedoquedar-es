name: Inicializar base de datos

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Inicializando base de datos
        env:
          SYNC_SECRET: ${{ secrets.INT_SYNC_SECRET_KEY }}
        run: |
          START=$(date +%s)

          TIMESTAMP=$(date +%s)

          SIGNATURE=$(echo -n "$TIMESTAMP" | openssl dgst -sha256 -hmac "$SYNC_SECRET" | awk '{print $2}')

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            https://mepuedoquedar.es/api/sync/init \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "X-Sync-Timestamp: $TIMESTAMP" \
            -H "X-Sync-Signature: $SIGNATURE" \
            -H "User-Agent: mepuedoquedar-sync/1.0")

          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

          echo "HTTP Status: $STATUS"
          echo "$BODY"

          END=$(date +%s)
          echo "⏱️ Duración: $((END-START)) segundos"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "❌ Error"
            exit 1
          fi

          echo "✅ Base de datos inicializada correctamente"