name: Sincronizar datos de la Junta de Castilla y León diariamente

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Llamando al endpoint de sincronización
        env:
          SYNC_SECRET: ${{ secrets.INT_SYNC_SECRET_KEY }}

        run: |
          TIMESTAMP=$(date +%s)

          SIGNATURE=$(echo -n "$TIMESTAMP" | openssl dgst -sha256 -hmac "$SYNC_SECRET" | awk '{print $2}')

          echo "Timestamp: $TIMESTAMP"
          echo "Signature generated"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            https://mepuedoquedar.es/api/sync \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "X-Sync-Timestamp: $TIMESTAMP" \
            -H "X-Sync-Signature: $SIGNATURE")

          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

          echo "HTTP Status: $STATUS"
          echo "Response:"
          echo "$BODY"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "❌ Sincronización fallida"
            exit 1
          fi

          echo "✅ Sincronización completada"