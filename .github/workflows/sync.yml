name: Sincronizar datos de la Junta de Castilla y León

on:
  schedule:
    - cron: '01 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group:
          - seguridad
          - educacion
          - comercio
          - turismo
          - economia
          - empleo
          - sanidad
          - ocio
          - cultura
          - juventud
          - deportes
          - sociedad
    timeout-minutes: 15
    steps:
      - name: Sincronizando grupo "${{ matrix.group }}"
        env:
          SYNC_SECRET: ${{ secrets.INT_SYNC_SECRET_KEY }}

        run: |
          START=$(date +%s)

          TIMESTAMP=$(date +%s)

          SIGNATURE=$(echo -n "$TIMESTAMP" | openssl dgst -sha256 -hmac "$SYNC_SECRET" | awk '{print $2}')

          echo "→ Grupo: ${{ matrix.group }}"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            https://mepuedoquedar.es/api/sync/${{ matrix.group }} \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "X-Sync-Timestamp: $TIMESTAMP" \
            -H "X-Sync-Signature: $SIGNATURE" \
            -H "User-Agent: mepuedoquedar-sync/1.0")

          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)

          echo "HTTP Status: $STATUS"
          echo "$BODY"

          END=$(date +%s)
          echo "⏱️ Duración: $((END-START)) segundos"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "❌ Grupo ${{ matrix.group }} falló"
            exit 1
          fi

          echo "✅ Grupo ${{ matrix.group }} completado"